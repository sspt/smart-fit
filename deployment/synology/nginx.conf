# Put TLS and any authentication in your Synology reverse proxy in front of this server.
# CORS is browser access policy, not authentication.
map $http_origin $fit_origin {
    default "";
    "https://fit.silvio.cloud" "https://fit.silvio.cloud";
}
server {
    listen 80;
    server_name _;
    root /srv/media;
    autoindex off;
    sendfile on;
    etag on;
    types {
        application/json json;
        application/vnd.apple.mpegurl m3u8;
        video/mp4 mp4;
        video/iso.segment m4s;
        image/jpeg jpg;
        image/webp webp;
    }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin $fit_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Vary Origin always;
    add_header Cache-Control "private" always;
    add_header X-Content-Type-Options nosniff always;
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    # Cache the catalogue only after revalidation; video paths are versioned.
    location = /catalog.json { try_files $uri =404; expires -1; }
    location ~ ^/hls/[a-z0-9-]+/(?:[a-z0-9-]+/)?[a-z0-9-]+\.(?:m3u8|mp4|m4s|jpg|webp)$ {
        try_files $uri =404;
        expires 365d;
    }
    location ~ ^/[a-z0-9-]+\.mp4$ { try_files $uri =404; expires 365d; }
    location / { return 404; }
}
